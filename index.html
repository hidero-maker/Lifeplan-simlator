<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E5A7A">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ライフプランシミュレーター</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@500&display=swap">
<style>
/* Layout: 左にメニュー、右に作業領域。スマホでは下タブ。数字は等幅で縦にそろえる */
:root {
  --bg: #F3F5F7; --surface: #FFFFFF; --surface-2: #EEF2F5; --fg: #1B2430; --muted: #586374; --line: #DDE3E9;
  --accent: #1E5A7A; --accent-soft: #E3EEF4; --on-accent: #FFFFFF;
  --warn: #A64B12; --warn-soft: #FBEFE4; --bad: #B4441F; --good: #2F7D55;
  --c-parent: #1E5A7A; --c-kid: #7FB3CF; --c-tax: #D9822B; --c-ideco: #7A65B8; --c-cash: #B7BFC9;
  --grid: #E3E8ED; --axis: #9AA5B1; --live: #1B2430; --on-live: #FFFFFF; --live-muted: #C9D4DE;
  --font-body: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic UI', system-ui, sans-serif;
  --font-num: 'Roboto Mono', ui-monospace, 'SFMono-Regular', monospace;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1720; --surface: #18222D; --surface-2: #202C39; --fg: #E8EDF2; --muted: #9AA8B6; --line: #2C3946;
  --accent: #6FB0D6; --accent-soft: #1D3342; --on-accent: #0F1720;
  --warn: #F0A868; --warn-soft: #3A2A1C; --bad: #F08A6C; --good: #7CC6A0;
  --c-parent: #4E9AC7; --c-kid: #A9D3EA; --c-tax: #E9A15A; --c-ideco: #A897DE; --c-cash: #6B7785;
  --grid: #26323F; --axis: #4A5868; --live: #E8EDF2; --on-live: #0F1720; --live-muted: #3F4A58; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F1720; --surface: #18222D; --surface-2: #202C39; --fg: #E8EDF2; --muted: #9AA8B6; --line: #2C3946;
  --accent: #6FB0D6; --accent-soft: #1D3342; --on-accent: #0F1720;
  --warn: #F0A868; --warn-soft: #3A2A1C; --bad: #F08A6C; --good: #7CC6A0;
  --c-parent: #4E9AC7; --c-kid: #A9D3EA; --c-tax: #E9A15A; --c-ideco: #A897DE; --c-cash: #6B7785;
  --grid: #26323F; --axis: #4A5868; --live: #E8EDF2; --on-live: #0F1720; --live-muted: #3F4A58; color-scheme: dark }

html, body { background: var(--bg); }
body { color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
.num, td, .kpi-val, input.n { font-variant-numeric: tabular-nums; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

.shell { display: flex; align-items: flex-start; gap: 8px; max-width: 1440px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.side { flex: 0 0 196px; position: sticky; top: env(safe-area-inset-top, 0px); padding-block: 24px; display: flex; flex-direction: column; gap: 4px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 12px 20px; font-weight: 700; font-size: 16px; }
.side a { display: block; padding: 10px 14px; border-radius: 10px; color: var(--muted); text-decoration: none; font-size: 15px; }
.side a[aria-current="page"] { background: var(--surface); color: var(--fg); font-weight: 700; box-shadow: 0 1px 2px rgba(20,30,45,.08); }
.side a:hover { color: var(--fg); }
main { flex: 1 1 auto; min-width: 0; padding-block: 24px 64px; display: flex; flex-direction: column; gap: 20px; }
.tabbar { display: none; }
@media (max-width: 760px) {
  .side { display: none; }
  main { padding-block: 16px 150px; }
  .tabbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
    padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  .tabbar a { flex: 1; min-height: 56px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); text-decoration: none; }
  .tabbar a[aria-current="page"] { color: var(--accent); font-weight: 700; }
}

.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.head h1 { font-size: 26px; }
.sub { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
.card { background: var(--surface); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card h2 { font-size: 17px; }
.card h3 { font-size: 15px; }
.row { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
.row > .wide { flex: 999 1 520px; min-width: 0; }
.row > .narrow { flex: 1 1 280px; min-width: 0; }
.grid-kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.kpi { background: var(--surface); border-radius: var(--radius); padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; }
.kpi-lbl { font-size: 13px; color: var(--muted); }
.kpi-val { font-size: 26px; font-weight: 700; line-height: 1.3; }
.kpi-val small { font-size: 14px; font-weight: 500; }
.kpi-note { font-size: 12.5px; color: var(--muted); }
.meter { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.meter > div { height: 100%; background: var(--accent); border-radius: 4px; }

.btn { min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-size: 14px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:hover { border-color: var(--axis); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.btn.ghost { border-style: dashed; color: var(--accent); background: transparent; }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 13px; }
.btn.danger { color: var(--bad); }
.btn.icon { min-height: 36px; width: 36px; padding: 0; color: var(--muted); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }

.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .tick { fill: var(--muted); font-size: 12px; font-family: var(--font-body); }
.chart .grid { stroke: var(--grid); stroke-dasharray: 3 3; }
.chart .axis { stroke: var(--axis); }
.chart rect.hit { fill: transparent; }
.chart g.bar:hover rect.hit { fill: var(--accent-soft); opacity: .5; }
.insight { margin: 0; font-size: 14px; color: var(--fg); line-height: 1.8; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 5px 10px; border-radius: 8px; background: var(--surface-2); font-size: 13px; }
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--fg); font-size: 14px; }
.alert b { color: var(--warn); }
.ok { color: var(--good); font-weight: 700; }

.tbl-wrap { overflow-x: auto; border-radius: var(--radius); background: var(--surface); }
table.data { border-collapse: collapse; font-size: 13px; width: 100%; }
table.data th, table.data td { padding: 9px 10px; text-align: right; white-space: nowrap; border-top: 1px solid var(--line); }
table.data thead th { background: var(--surface-2); color: var(--muted); font-weight: 500; font-size: 12px; border-top: 0; position: sticky; top: 0; }
table.data th.l, table.data td.l { text-align: left; }
table.data tbody th { font-weight: 700; }
table.data .stick { position: sticky; left: 0; background: var(--surface); z-index: 1; }
table.data thead .stick { background: var(--surface-2); z-index: 2; }
table.data .neg { color: var(--bad); font-weight: 700; }
table.data .tot { font-weight: 700; }
table.data .memo { color: var(--muted); text-align: left; }
table.data tr.mark td, table.data tr.mark th { background: var(--accent-soft); }
.hide-flow .g-flow, .hide-inv .g-inv, .hide-acc .g-acc, .hide-living .g-living, .hide-detail .g-detail { display: none; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toggle { min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; cursor: pointer; }
.toggle[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); }
.tabs button { flex: none; min-height: 44px; padding: 0 14px; border: 0; border-bottom: 3px solid transparent; background: none; color: var(--muted); cursor: pointer; font-size: 14px; }
.tabs button[aria-selected="true"] { color: var(--fg); font-weight: 700; border-bottom-color: var(--accent); }

.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px 16px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field .lbl { font-size: 13px; color: var(--muted); }
.inp { display: flex; align-items: center; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; background: var(--surface); }
.inp:focus-within { border-color: var(--accent); }
.inp input, .inp select { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 16px; padding: 0; height: 42px; }
.inp input.n { text-align: right; }
.inp .unit { font-size: 12.5px; color: var(--muted); margin-left: 6px; white-space: nowrap; }
.inp.sm { min-height: 40px; }
.inp.sm input { height: 38px; font-size: 15px; }
.check { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; font-size: 14px; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.hint { font-size: 12.5px; color: var(--muted); margin: 0; line-height: 1.7; }
.list { display: flex; flex-direction: column; }
.list > .it { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
.list > .it:first-child { border-top: 0; }
.it .who { min-width: 76px; font-size: 14px; }
.it .grow { flex: 1; min-width: 0; }
.it .note { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); line-height: 1.4; }
.it .note.warn { color: var(--warn); }
.subcard { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.calc { font-size: 14px; } .calc b { font-size: 16px; }

.matrix { overflow-x: auto; }
.matrix table { border-collapse: collapse; font-size: 14px; }
.matrix th, .matrix td { padding: 4px; }
.matrix thead th { text-align: center; line-height: 1.3; padding-bottom: 8px; }
.matrix thead th span { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
.matrix tbody th { text-align: left; font-weight: 500; white-space: nowrap; padding-right: 12px; min-width: 150px; }
.matrix tbody th .meta { display: flex; gap: 8px; align-items: center; font-size: 11.5px; color: var(--muted); font-weight: 400; }
.matrix input.cell { width: 76px; height: 38px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 8px; text-align: right; padding: 0 8px; background: var(--surface); font-size: 14.5px; }
.matrix input.cell.chg { border-color: var(--accent); background: var(--accent-soft); }
.matrix tfoot td, .matrix tfoot th { border-top: 2px solid var(--fg); padding-top: 10px; font-weight: 700; text-align: center; }
.matrix tfoot th { text-align: left; }
.living-phone { display: none; }
@media (max-width: 760px) { .living-pc { display: none; } .living-phone { display: flex; } }
.agechips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.agechips button { flex: none; min-width: 64px; min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; line-height: 1.25; }
.agechips button span { display: block; font-size: 11px; color: var(--muted); }
.agechips button[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.agechips button[aria-checked="true"] span { color: var(--on-accent); }

.live { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; background: var(--live); color: var(--on-live); border-radius: 12px; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; }
.live .l { font-size: 12.5px; color: var(--live-muted); }
.live .v { font-size: 19px; font-weight: 700; }
.live .d { font-size: 12.5px; }
@media (max-width: 760px) { .live .v { font-size: 16px; } .live { gap: 2px 10px; padding: 8px 14px; } .live { position: fixed; top: auto; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(64px + env(safe-area-inset-bottom, 0px)); } }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
textarea.json { width: 100%; min-height: 140px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--surface); font-family: var(--font-num); font-size: 12px; }
.status { font-size: 13px; color: var(--muted); }
.status.err { color: var(--bad); }
.status.okk { color: var(--good); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 10px; font-size: 14px; z-index: 50; }
@media (max-width: 760px) { .toast { bottom: calc(130px + env(safe-area-inset-bottom, 0px)); } }

/* スマートディスプレイ表示(Fire HD 8 横向き)。常に暗い配色 */
#display { position: fixed; inset: 0; z-index: 100; background: #0F1720; color: #E8EDF2; overflow: auto;
  padding: calc(24px + env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(28px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 18px; }
#display[hidden] { display: none !important; }
.dp-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
.dp-top h1 { font-size: 28px; }
.dp-muted { color: #9AA8B6; font-size: 15px; }
.dp-close { min-height: 52px; padding: 0 24px; border-radius: 26px; border: 1px solid #3A4757; background: #18222D; color: #E8EDF2; font-size: 17px; cursor: pointer; }
.dp-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.dp-card { background: #18222D; border-radius: 18px; padding: 18px 22px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.dp-val { font-size: 34px; font-weight: 700; line-height: 1.25; }
.dp-val small { font-size: 17px; font-weight: 500; }
.dp-main { display: flex; flex-wrap: wrap; gap: 14px; flex: 1; }
.dp-main .dp-card.wide { flex: 2 1 560px; }
.dp-main .side-col { flex: 1 1 280px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
#display .tick { fill: #9AA8B6; font-size: 19px; }
#display .grid { stroke: #2E3A48; stroke-dasharray: 3 3; }
#display .axis { stroke: #4A5868; }
/* グラフの拡大表示 */
.chart-open { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; position: relative; border-radius: 10px; text-align: left; }
.chart-open:hover { background: var(--surface-2); }
.chart-hint { position: absolute; right: 8px; top: 2px; font-size: 12px; color: var(--muted); background: var(--surface); padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); }
#zoom { position: fixed; inset: 0; z-index: 120; background: var(--bg); color: var(--fg); display: flex; flex-direction: column; gap: 10px;
  padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#zoom[hidden] { display: none !important; }
#zoom.dk { --bg: #0F1720; --surface: #18222D; --surface-2: #202C39; --fg: #E8EDF2; --muted: #9AA8B6; --line: #2C3946; --grid: #26323F; --axis: #4A5868;
  --c-parent: #4E9AC7; --c-kid: #A9D3EA; --c-tax: #E9A15A; --c-ideco: #A897DE; --c-cash: #6B7785; --bad: #F08A6C; --good: #7CC6A0; --warn: #F0A868; color-scheme: dark; }
.zm-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.zm-top h2 { font-size: 18px; }
.zm-body { flex: 1; min-height: 0; display: flex; gap: 14px; }
.zm-chart { flex: 1 1 auto; min-width: 0; min-height: 0; background: var(--surface); border-radius: var(--radius); padding: 10px 10px 6px; display: flex; flex-direction: column; }
.zm-svg { flex: 1; min-height: 0; touch-action: none; cursor: crosshair; }
.zm-svg svg { width: 100%; height: 100%; display: block; }
.zm-svg .grid { stroke: var(--grid); stroke-dasharray: 3 3; } .zm-svg .axis { stroke: var(--axis); } .zm-svg .tick { fill: var(--muted); }
.zm-svg rect.hit { fill: transparent; }
.zm-panel { flex: 0 0 300px; min-width: 0; background: var(--surface); border-radius: var(--radius); padding: 16px 18px; overflow: auto; display: flex; flex-direction: column; gap: 10px; font-variant-numeric: tabular-nums; }
.zm-panel h3 { font-size: 20px; }
.zm-panel .ages { font-size: 13px; color: var(--muted); }
.zm-total { font-size: 28px; font-weight: 700; line-height: 1.2; }
.zm-total small { font-size: 14px; font-weight: 500; }
.zm-grp { display: flex; flex-direction: column; border-top: 1px solid var(--line); padding-top: 8px; }
.zm-grp h4 { margin: 0 0 4px; font-size: 12px; color: var(--muted); font-weight: 500; }
.zm-row { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; line-height: 1.75; }
.zm-row span:first-child { display: inline-flex; align-items: center; gap: 6px; }
.zm-row i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.zm-row.b { font-weight: 700; }
.zm-row .neg { color: var(--bad); }
.zm-memo { font-size: 13px; color: var(--muted); line-height: 1.6; }
.zm-nav { display: flex; gap: 8px; }
@media (max-width: 760px), (max-aspect-ratio: 1/1) {
  .zm-body { flex-direction: column; }
  .zm-chart { flex: 0 0 auto; height: 46vh; }
  .zm-panel { flex: 1 1 auto; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

</head>
<body>
<div class="shell">
  <nav class="side" aria-label="メインメニュー">
    <div class="brand"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="8" style="fill:var(--accent)"></rect><path d="M7 19l5-5 4 3 5-7" style="stroke:var(--on-accent);fill:none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>ライフプラン</div>
    <a href="#home" data-nav="home">ホーム</a>
    <a href="#input" data-nav="input">前提条件</a>
    <a href="#table" data-nav="table">年次推移表</a>
    <a href="#compare" data-nav="compare">シナリオ比較</a>
    <a href="#sync" data-nav="sync">同期とデータ</a>
  </nav>
  <main id="view" aria-live="polite"></main>
</div>
<nav class="tabbar" aria-label="メインメニュー">
  <a href="#home" data-nav="home">ホーム</a>
  <a href="#input" data-nav="input">前提条件</a>
  <a href="#table" data-nav="table">推移表</a>
  <a href="#compare" data-nav="compare">比較</a>
  <a href="#sync" data-nav="sync">同期</a>
</nav>
<div id="display" hidden></div>
<div id="zoom" hidden role="dialog" aria-modal="true" aria-label="資産推移の拡大"></div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
/*
 * ライフプランシミュレーター 計算エンジン v2
 * PC・スマホのブラウザ版とスマートディスプレイの両方で使う共通プログラム。
 * 入力(JSON)を受け取り、1年ごとの収支・口座残高を返す。金額はすべて円。
 */
(function (root) {
  'use strict';

  // 住宅ローン 元利均等返済の毎月返済額
  function monthlyLoanPayment(principal, annualRate, years) {
    const n = Math.round(years * 12);
    if (principal <= 0 || n <= 0) return 0;
    const i = annualRate / 12;
    if (i === 0) return principal / n;
    const f = Math.pow(1 + i, n);
    return (principal * i * f) / (f - 1);
  }

  // 5年ごとなどの入力点の間を直線で補間(範囲外は端の値)。点は {age, amount}
  function interpolate(points, x) {
    if (!points || points.length === 0) return 0;
    const p = points
      .map((q) => ({ age: q.age != null ? q.age : q.headAge, amount: Number(q.amount) || 0 }))
      .sort((a, b) => a.age - b.age);
    if (x <= p[0].age) return p[0].amount;
    const last = p[p.length - 1];
    if (x >= last.age) return last.amount;
    for (let k = 0; k < p.length - 1; k++) {
      const a = p[k], b = p[k + 1];
      if (x >= a.age && x <= b.age) {
        if (b.age === a.age) return b.amount;
        return a.amount + (b.amount - a.amount) * ((x - a.age) / (b.age - a.age));
      }
    }
    return last.amount;
  }

  function inRange(year, from, to) {
    return (from == null || year >= from) && (to == null || year <= to);
  }

  // 児童手当(2024年10月以降の制度):高校生年代まで、所得制限なし
  //   3歳未満 月1.5万円、3歳以上 月1万円、第3子以降は月3万円(第3子の数え方は22歳年度末までの子)
  function childAllowanceFor(children, idx, year) {
    const age = year - children[idx].birthYear;
    if (age < 0 || age > 18) return 0;
    const olderInCount = children.slice(0, idx).filter((c) => {
      const a = year - c.birthYear;
      return a >= 0 && a <= 22;
    }).length;
    if (olderInCount >= 2) return 30000 * 12;
    return (age < 3 ? 15000 : 10000) * 12;
  }

  // 口座から手取り額 net を得るために売却する
  function sell(acc, net, taxRate, isTaxable) {
    if (net <= 0 || acc.balance <= 0) return { net: 0, gross: 0, tax: 0 };
    if (!isTaxable) {
      const gross = Math.min(net, acc.balance);
      acc.principal *= 1 - gross / acc.balance;
      acc.balance -= gross;
      return { net: gross, gross, tax: 0 };
    }
    const gainFrac = Math.max(0, (acc.balance - acc.cost) / acc.balance);
    const keep = 1 - gainFrac * taxRate;
    let gross = net / keep;
    if (gross > acc.balance) gross = acc.balance;
    const tax = gross * gainFrac * taxRate;
    acc.cost *= 1 - gross / acc.balance;
    acc.balance -= gross;
    return { net: gross - tax, gross, tax };
  }

  function simulate(input) {
    const h = input.household;
    const a = input.assumptions;
    const s = input.snapshot;
    const r = a.returnRate;
    const tax = a.taxRate;
    const priceBase = a.priceBaseYear || s.year;
    const startYear = s.year;
    const endYear = h.headBirthYear + (input.endHeadAge || 80);
    const children = h.children || [];

    // 口座の状態
    const cash = { v: s.cash };
    const parent = { balance: s.parentNisa.balance, principal: s.parentNisa.principal };
    const taxable = { balance: s.taxable.balance, cost: s.taxable.cost };
    const kids = children.map((c, idx) => {
      const k = (s.childNisa && s.childNisa[idx]) || { balance: 0, principal: 0 };
      return { name: c.name, birthYear: c.birthYear, balance: k.balance || 0, principal: k.principal || 0 };
    });
    const idecos = (input.ideco || []).map((d, idx) => {
      const k = (s.ideco && s.ideco[idx]) || { balance: 0, principal: 0 };
      return Object.assign({}, d, { balance: k.balance || 0, principal: k.principal || 0, received: false });
    });
    const accounts = { taxable, parentNisa: parent };

    const hs = input.housing || { enabled: false };
    const loanAmount = hs.enabled ? Math.max(0, hs.price - hs.downPayment) : 0;
    const loanMonthly = hs.enabled ? monthlyLoanPayment(loanAmount, hs.rate, hs.years) : 0;

    const inv = input.invest;
    const wd = input.withdraw || {};
    const reserve = wd.reserve || 0;
    const inc = input.income;

    const rows = [];
    const warnings = [];

    for (let year = startYear; year <= endYear; year++) {
      const headAge = year - h.headBirthYear;
      const spouseAge = h.spouseBirthYear ? year - h.spouseBirthYear : null;
      const ageOf = (who) => (who === 'spouse' ? spouseAge : headAge);
      const infl = Math.pow(1 + a.inflation, year - priceBase);
      const bought = hs.enabled && year >= hs.purchaseYear;

      // 1. 収入(給与・退職金・年金・児童手当)
      let salary = 0, bonus = 0;
      if (inc.persons) {
        inc.persons.forEach((p) => {
          const age = ageOf(p.who);
          if (age == null) return;
          if (age <= p.lastWorkAge && p.points && p.points.length) salary += interpolate(p.points, age);
          if (p.retirementBonus && age === p.lastWorkAge + 1) bonus += p.retirementBonus;
        });
      } else if (headAge <= inc.lastWorkAge) {
        salary = interpolate(inc.points, headAge);
      }
      let pension = 0;
      (inc.pensions || []).forEach((p) => {
        const age = ageOf(p.who);
        if (age != null && age >= p.startAge) pension += p.annual;
      });
      let childAllowance = 0;
      if (!input.childAllowance || input.childAllowance.enabled !== false) {
        children.forEach((c, idx) => { childAllowance += childAllowanceFor(children, idx, year); });
      }
      let eventIncome = 0;

      // 2. 生活費
      let living = 0;
      const livingByItem = {};
      (input.expenses || []).forEach((e) => {
        if (e.role === 'rent' && bought) return;
        if (!inRange(year, e.startYear, e.endYear)) return;
        const base = e.points && e.points.length ? interpolate(e.points, headAge) : e.amount;
        if (!base) return;
        const annual = (e.unit === 'month' ? base * 12 : base) * (e.inflation === false ? 1 : infl);
        living += annual;
        livingByItem[e.name] = annual;
      });
      if (bought && hs.maintenance) living += hs.maintenance * infl;

      // 3. 住宅費
      let housingCost = 0;
      if (hs.enabled) {
        if (year === hs.purchaseYear) housingCost += hs.downPayment + (hs.costs || 0);
        if (year > hs.purchaseYear && year <= hs.purchaseYear + hs.years) housingCost += loanMonthly * 12;
      }

      // 4. イベント(プラスは支出、マイナスは収入)
      let eventCost = 0;
      const eventNames = [];
      (input.events || []).forEach((ev) => {
        if (Number(ev.year) !== year) return;
        if (ev.amount >= 0) eventCost += ev.amount; else eventIncome += -ev.amount;
        eventNames.push(ev.name);
      });

      // 5. iDeCo(掛金は現金から、節税額は収入に加える。受取年に一括で現金へ)
      let idecoIn = 0, taxSaving = 0, idecoReceive = 0;
      const idecoContrib = idecos.map((d) => {
        const age = ageOf(d.who);
        if (age == null || d.received) return 0;
        if (year < (d.startYear || startYear)) return 0;
        if (age >= d.endAge || age >= d.receiveAge) return 0;
        const c = (d.monthly || 0) * 12;
        idecoIn += c;
        taxSaving += c * (d.taxSavingRate || 0);
        return c;
      });

      const income = salary + bonus + pension + childAllowance + eventIncome + taxSaving;
      const expense = living + housingCost + eventCost;
      const net = income - expense;
      cash.v += net - idecoIn;

      // 9. 計画的な取り崩し(期首残高から売却)
      let plannedWithdraw = 0, withdrawTax = 0;
      if (wd.startHeadAge != null && headAge >= wd.startHeadAge && wd.monthly > 0) {
        let need = wd.monthly * 12 * (wd.inflate ? infl : 1);
        for (const key of wd.order || ['taxable', 'parentNisa']) {
          if (need <= 0) break;
          const res = sell(accounts[key], need, tax, key === 'taxable');
          need -= res.net; plannedWithdraw += res.net; withdrawTax += res.tax;
        }
        cash.v += plannedWithdraw;
      }

      // 7. 積立(毎年の積立額。入力のない年は0)
      let planned = 0;
      if (inv.byYear && inv.byYear[year] != null) planned = Number(inv.byYear[year]) || 0;
      else {
        const planEntry = (inv.plan || []).find((p) => inRange(year, p.fromYear, p.toYear));
        planned = planEntry ? planEntry.annual : 0;
      }
      let investable = planned;
      if (inv.reduceWhenShort !== false) investable = Math.min(planned, Math.max(0, cash.v - reserve));
      let left = investable;

      const pRoom = Math.max(0, Math.min(inv.parentNisa.annualCap, inv.parentNisa.lifetimeCap - parent.principal));
      const pIn = Math.min(left, pRoom); left -= pIn;
      parent.principal += pIn;

      const kidIn = kids.map((k) => {
        const age = year - k.birthYear;
        const c = inv.childNisa;
        if (!c || year < c.startYear || age < 0 || age >= c.untilAge) return 0;
        const room = Math.max(0, Math.min(c.annualCap, c.lifetimeCap - k.principal));
        const x = Math.min(left, room); left -= x; k.principal += x;
        return x;
      });

      const tIn = left; left = 0;
      taxable.cost += tIn;
      const invested = pIn + tIn + kidIn.reduce((x, y) => x + y, 0);
      cash.v -= invested;

      // 8. 運用益(積立は年の途中に行う想定で半年分)
      parent.balance = parent.balance * (1 + r) + pIn * (1 + r / 2);
      taxable.balance = taxable.balance * (1 + r) + tIn * (1 + r / 2);
      kids.forEach((k, idx) => { k.balance = k.balance * (1 + r) + kidIn[idx] * (1 + r / 2); });
      idecos.forEach((d, idx) => {
        d.balance = d.balance * (1 + r) + idecoContrib[idx] * (1 + r / 2);
        d.principal += idecoContrib[idx];
        const age = ageOf(d.who);
        if (!d.received && age != null && age >= d.receiveAge && d.balance > 0) {
          idecoReceive += d.balance;
          d.balance = 0; d.principal = 0; d.received = true;
        }
      });
      cash.v += idecoReceive;

      // 10. 現金不足時の追加売却(子NISAは保持)
      let emergency = 0;
      if (wd.emergency !== false && cash.v < reserve) {
        let need = reserve - cash.v;
        for (const key of wd.order || ['taxable', 'parentNisa']) {
          if (need <= 0) break;
          const res = sell(accounts[key], need, tax, key === 'taxable');
          need -= res.net; emergency += res.net; withdrawTax += res.tax;
        }
        cash.v += emergency;
      }

      // 11. 集計
      const kidsTotal = kids.reduce((x, k) => x + k.balance, 0);
      const idecoTotal = idecos.reduce((x, d) => x + d.balance, 0);
      const total = cash.v + parent.balance + taxable.balance + kidsTotal + idecoTotal;
      const unrealized = Math.max(0, taxable.balance - taxable.cost);
      const totalAfterTax = total - unrealized * tax;

      if (cash.v < 0 && !warnings.some((w) => w.type === 'cashShort')) {
        warnings.push({ type: 'cashShort', year, headAge, message: `${year}年(${headAge}歳)に現金がマイナスになります` });
      }
      const reduced = planned - investable > 1;

      rows.push({
        year, headAge, spouseAge,
        childAges: kids.map((k) => year - k.birthYear),
        salary, bonus, pension, childAllowance, eventIncome, taxSaving, income,
        living, livingByItem, housingCost, eventCost, eventNames, expense, net,
        plannedInvest: planned, invested, reduced, parentIn: pIn, childIn: kidIn, taxableIn: tIn,
        idecoIn, idecoReceive, ideco: idecoTotal,
        plannedWithdraw, emergency, withdrawTax,
        cash: cash.v,
        parentNisa: parent.balance, parentPrincipal: parent.principal,
        childNisa: kids.map((k) => k.balance), childPrincipal: kids.map((k) => k.principal),
        childNisaTotal: kidsTotal,
        taxable: taxable.balance, taxableCost: taxable.cost,
        total, totalAfterTax,
      });
    }

    const at = (age) => rows.find((x) => x.headAge === age) || null;
    const depletedIdx = rows.findIndex((x, i) => i > 0 && x.cash < 0 && x.parentNisa + x.taxable < 1);
    if (depletedIdx >= 0) {
      const d = rows[depletedIdx];
      warnings.push({ type: 'depleted', year: d.year, headAge: d.headAge, message: `${d.year}年(${d.headAge}歳)に取り崩せる資産が尽きます` });
    }
    const reducedYears = rows.filter((x) => x.reduced).map((x) => x.year);
    const taxableGone = rows.find((x, i) => i > 0 && rows[i - 1].taxable > 1 && x.taxable < 1);

    return {
      rows,
      loan: { amount: loanAmount, monthly: loanMonthly, annual: loanMonthly * 12 },
      summary: {
        now: rows[0],
        at65: at(65),
        end: rows[rows.length - 1],
        peak: rows.reduce((m, x) => (x.total > m.total ? x : m), rows[0]),
        parentNisaFilledYear: (rows.find((x) => x.parentPrincipal >= inv.parentNisa.lifetimeCap - 1) || {}).year || null,
        reducedYears,
        taxableGoneYear: taxableGone ? taxableGone.year : null,
      },
      warnings,
    };
  }

  const api = { simulate, monthlyLoanPayment, interpolate, childAllowanceFor };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.LifePlanEngine = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

function normalize(inp) {

  while (inp.snapshot.childNisa.length < inp.household.children.length) inp.snapshot.childNisa.push({ balance: 0, principal: 0 });
  inp.snapshot.childNisa.length = inp.household.children.length;
  inp.ideco = inp.ideco || [];
  inp.snapshot.ideco = inp.snapshot.ideco || [];
  while (inp.snapshot.ideco.length < inp.ideco.length) inp.snapshot.ideco.push({ balance: 0, principal: 0 });
  inp.snapshot.ideco.length = inp.ideco.length;
  inp.events = inp.events || [];
  inp.invest.byYear = inp.invest.byYear || {};
  inp.income.persons = inp.income.persons || [];
  inp.income.pensions = inp.income.pensions || [];
  if (!inp.livingAges) {
    var first = (inp.expenses[0] && inp.expenses[0].points) || [];
    inp.livingAges = first.length ? first.map(function (p) { return p.age; }) : [36, 41, 46, 51, 56, 61, 66, 71, 76];
  }
  inp.expenses.forEach(function (e) {
    var map = {};
    (e.points || []).forEach(function (p) { map[p.age != null ? p.age : p.headAge] = p.amount; });
    var lastVal = e.amount || 0;
    e.points = inp.livingAges.map(function (age) {

}

function lineChart(sets) {
  var W = 1000, H = 300, L = 64, B = 40, T = 10, Rr = 8, ih = H - B - T, iw = W - L - Rr;
  var y0 = Math.min.apply(null, sets.map(function (s) { return s.res.rows[0].year; }));
  var y1 = Math.max.apply(null, sets.map(function (s) { return s.res.rows[s.res.rows.length - 1].year; }));
  var maxV = Math.max.apply(null, sets.map(function (s) { return Math.max.apply(null, s.res.rows.map(function (r) { return r.total; })); }));
  var nm = niceMax(maxV); var X = function (y) { return L + (y - y0) / Math.max(1, y1 - y0) * iw; }; var Y = function (v) { return T + ih - Math.max(0, v) / nm.max * ih; };
  var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="シナリオごとの総資産の推移">';
  for (var t = 0; t <= nm.max + 1; t += nm.step) out += '<line class="grid" x1="' + L + '" x2="' + (W - Rr) + '" y1="' + Y(t) + '" y2="' + Y(t) + '"></line><text class="tick" x="' + (L - 8) + '" y="' + (Y(t) + 4) + '" text-anchor="end"' + fst + '>' + tickLabel(t) + '</text>';
  var hb = D.input.household.headBirthYear;
  for (var y = y0; y <= y1; y++) if ((y - y0) % 10 === 0) out += '<text class="tick" x="' + X(y) + '" y="' + (H - B + 16) + '" text-anchor="middle">' + y + '</text><text class="tick" x="' + X(y) + '" y="' + (H - B + 32) + '" text-anchor="middle">' + (y - hb) + '歳</text>';
  sets.forEach(function (s, i) {
    var c = LINE_COLORS[i % LINE_COLORS.length];
    var d = s.res.rows.map(function (r, k) { return (k ? 'L' : 'M') + X(r.year).toFixed(1) + ' ' + Y(r.total).toFixed(1); }).join(' ');
    out += '<path d="' + d + '" style="fill:none;stroke:' + c + '" stroke-width="' + (i === 0 ? 3 : 2) + '"' + (i === 0 ? '' : ' stroke-dasharray="6 4"') + '></path>';
    var last = s.res.rows[s.res.rows.length - 1];
    out += '<circle cx="' + X(last.year) + '" cy="' + Y(last.total) + '" r="4" style="fill:' + c + '"></circle>';
  });
  return out + '<line class="axis" x1="' + L + '" x2="' + (W - Rr) + '" y1="' + (T + ih) + '" y2="' + (T + ih) + '"></line></svg>';
}

// ---------- グラフの拡大表示 ----------
var ZM = null; // { rows, inp, dark, sel }
function openZoom(src) {
  var rows, inp, dark = false;
  if (src) { rows = src.R.rows; inp = src.input; dark = true; }
  else { rows = R.rows; inp = D.input; }
  if (!rows || !rows.length) return;
  var sel = 0;
  if (ZM && ZM.rows === rows) sel = ZM.sel;
  ZM = { rows: rows, inp: inp, dark: dark, sel: sel, prevFocus: document.activeElement };
  var el = document.getElementById('zoom');
  el.className = dark ? 'dk' : '';
  el.innerHTML = '<div class="zm-top"><h2>口座別の資産推移</h2>' + legendHtml() +
    '<div class="zm-nav"><button type="button" class="btn small" id="zm-prev" aria-label="前の年">◀ 前の年</button><button type="button" class="btn small" id="zm-next" aria-label="次の年">次の年 ▶</button><button type="button" class="btn small" id="zm-close">閉じる</button></div></div>' +
    '<div class="zm-body"><div class="zm-chart"><div class="zm-svg" id="zm-svg"></div><p class="hint" style="margin:4px 4px 0">グラフを触ると、その年の金額を表示します。指を左右に動かすと年を変えられます。</p></div><div class="zm-panel" id="zm-panel" aria-live="polite"></div></div>';
  el.hidden = false;
  document.getElementById('zm-close').onclick = closeZoom;
  document.getElementById('zm-prev').onclick = function () { zoomSelect(ZM.sel - 1); };
  document.getElementById('zm-next').onclick = function () { zoomSelect(ZM.sel + 1); };
  var box = document.getElementById('zm-svg');
  var down = false;
  var pick = function (e) {
    var svg = box.querySelector('svg'); if (!svg) return;
    var rc = svg.getBoundingClientRect();
    var x = (e.clientX - rc.left) / rc.width * 1000;
    var Lm = Number(svg.getAttribute('data-l')), bw = Number(svg.getAttribute('data-bw'));
    var i = Math.floor((x - Lm) / bw);
    zoomSelect(Math.max(0, Math.min(ZM.rows.length - 1, i)));
  };
  box.onpointerdown = function (e) { down = true; try { box.setPointerCapture(e.pointerId); } catch (_) {} pick(e); if (ZM.dark) dpLeft = dpTimeout; };
  box.onpointermove = function (e) { if (down || e.pointerType === 'mouse') pick(e); };
  box.onpointerup = box.onpointercancel = function () { down = false; };
  el.onpointerdown = function () { if (ZM && ZM.dark) dpLeft = dpTimeout; };
  drawZoom();
  window.addEventListener('resize', drawZoom);
  document.addEventListener('keydown', zoomKey);
  document.getElementById('zm-close').focus();
}
function closeZoom() {
  var el = document.getElementById('zoom');
  if (!el || el.hidden) return;
  el.hidden = true; el.innerHTML = '';
  window.removeEventListener('resize', drawZoom);
  document.removeEventListener('keydown', zoomKey);
  if (ZM && ZM.prevFocus && ZM.prevFocus.focus) try { ZM.prevFocus.focus(); } catch (_) {}
}
function zoomKey(e) {
  if (e.key === 'Escape') { closeZoom(); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { zoomSelect(ZM.sel - 1); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { zoomSelect(ZM.sel + 1); e.preventDefault(); }
}
function zoomSelect(i) {
  if (!ZM) return;
  i = Math.max(0, Math.min(ZM.rows.length - 1, i));
  if (i === ZM.sel && document.getElementById('zm-svg').firstChild) return;
  ZM.sel = i; drawZoom();
}
function drawZoom() {
  if (!ZM) return;
  var box = document.getElementById('zm-svg'); if (!box) return;
  var w = Math.max(200, box.clientWidth), h = Math.max(160, box.clientHeight);
  var k = 1000 / w;                       // 画面の1pxあたりのグラフ上の長さ
  var fs = Math.round(13 * k * 10) / 10;  // 画面上で約13pxの文字
  var H = Math.round(1000 * h / w);
  var colors = ZM.dark ? { parentNisa: '#4E9AC7', ideco: '#A897DE', childNisaTotal: '#A9D3EA', taxable: '#E9A15A', cash: '#6B7785' } : null;
  box.innerHTML = stackChart(ZM.rows, { h: H, fs: fs, L: Math.round(fs * 4.8), sel: ZM.sel, colors: colors, label: '口座別の資産推移(拡大)' });
  document.getElementById('zm-panel').innerHTML = zoomPanel(ZM.rows[ZM.sel], ZM.inp);
  document.getElementById('zm-prev').disabled = ZM.sel <= 0;
  document.getElementById('zm-next').disabled = ZM.sel >= ZM.rows.length - 1;
}

function updateCalcs() {
  var q = function (k) { return document.querySelector('[data-calc="' + k + '"]'); };
  var s = R.summary;
  if (q('at65')) q('at65').textContent = s.at65 ? bigYen(s.at65.total) : '—';
  if (q('end')) q('end').textContent = s.end ? bigYen(s.end.total) : '—';
  if (q('delta')) q('delta').textContent = deltaTxt(baseline && baseline.at65 && s.at65 ? s.at65.total - baseline.at65 : null);
  if (q('loanAmount')) { q('loanAmount').textContent = n0(R.loan.amount / 1e4) + '万円'; q('loanMonthly').textContent = round1(R.loan.monthly / 1e4) + '万円'; q('loanAnnual').textContent = round1(R.loan.annual / 1e4) + '万円'; }
  if (q('caNow') && R.rows[0]) q('caNow').textContent = round1(R.rows[0].childAllowance / 1e4) + '万円';
  document.querySelectorAll('[data-calc-year]').forEach(function (el) {
    var y = Number(el.getAttribute('data-calc-year')); var r = R.rows.find(function (x) { return x.year === y; });
    if (!r) { el.textContent = ''; return; }
    var parts = [];
    if (r.parentIn) parts.push('親' + manTxt(r.parentIn));
    r.childIn.forEach(function (v, i) { if (v) parts.push((D.input.household.children[i] ? D.input.household.children[i].name : '子') + manTxt(v)); });
    if (r.taxableIn) parts.push('特定' + manTxt(r.taxableIn));

    el.textContent = r.reduced ? '現金不足で' + manTxt(r.invested) + '万円に減額' : parts.join('・');
  });
}

// ---------- 入力イベント ----------
function onInput(ev) {
  var t = ev.target;
  if (t.hasAttribute('data-bulk')) { ui.bulk = ui.bulk || {}; ui.bulk[t.getAttribute('data-bulk')] = t.value; return; }
  if (t.hasAttribute('data-setting')) {
    var key = t.getAttribute('data-setting');
    D.settings[key] = t.type === 'checkbox' ? t.checked : t.value.trim();
    persistLocal();
    if (key === 'clientId') { var b = document.querySelector('[data-act="driveConnect"]'); if (b) b.disabled = !D.settings.clientId; drive.token = null; }
    return;
  }
  var path = t.getAttribute('data-path'); if (!path) return;
  if (t.hasAttribute('data-bool')) { setPath(D.input, path, t.checked); if (path === 'housing.enabled') { changed(); render(); return; } }
  else if (t.hasAttribute('data-text')) setPath(D.input, path, t.value);
  else {
    var raw = String(t.value).replace(/[,，\s万円%]/g, '').replace(/[０-９．－]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
    if (raw === '' || raw === '-') {
      if (path.indexOf('invest.byYear.') === 0) setPath(D.input, path, undefined);
      else return;
    } else {
      var v = Number(raw); if (isNaN(v)) return;
      if (t.hasAttribute('data-pct')) v = v / 100;
      else v = v * Number(t.getAttribute('data-scale') || 1);
      if (t.hasAttribute('data-int')) v = Math.round(v);
      if (t.hasAttribute('data-abs')) v = Math.abs(v) * Number(t.getAttribute('data-abs'));
      setPath(D.input, path, v);
    }
  }
  normalize(D.input);
  changed();
}
function onChangeStructural(ev) {
  var t = ev.target;
  var path = t.getAttribute('data-path') || '';
  // 年齢列や生年など、表示の並びに影響する入力は確定時に描き直す
  if (/^(household\.|income\.persons\.\d+\.points\.\d+\.age|snapshot\.year|endHeadAge|events\.\d+\.year|invest\.childNisa)/.test(path) || t.id === 'file-import') {
    if (t.id === 'file-import') return importFile(t);
    render();
  }
}
var ACTS = {
  tab: function (a) { ui.tab = a; render(); return 'norecalc'; },
  goSnapshot: function () { ui.tab = 'snapshot'; if (ui.view === 'input') render(); else location.hash = 'input'; return 'norecalc'; },
  addPoint: function (a) { var p = D.input.income.persons[+a]; var last = p.points[p.points.length - 1]; p.points.push({ age: last ? last.age + 5 : 40, amount: last ? last.amount : 0 }); },
  delPoint: function (a) { var x = a.split(','); D.input.income.persons[+x[0]].points.splice(+x[1], 1); },
  addPension: function () { D.input.income.pensions.push({ who: 'head', startAge: 65, annual: 1500000 }); },
  delPension: function (a) { D.input.income.pensions.splice(+a, 1); },
  addItem: function () { var ages = D.input.livingAges; D.input.expenses.push({ name: '新しい費目', unit: 'month', points: ages.map(function (g) { return { age: g, amount: 0 }; }) }); },
  delItem: function (a) { D.input.expenses.splice(+a, 1); },
  unitYear: function (a, el) { D.input.expenses[+a].unit = el.checked ? 'year' : 'month'; },
  rent: function (a, el) { var e = D.input.expenses[+a]; if (el.checked) e.role = 'rent'; else delete e.role; },
  addAgeCol: function () { var ages = D.input.livingAges; var nx = ages[ages.length - 1] + 5; ages.push(nx); D.input.expenses.forEach(function (e) { var l = e.points[e.points.length - 1]; e.points.push({ age: nx, amount: l ? l.amount : 0 }); }); },
  delAgeCol: function () { var ages = D.input.livingAges; if (ages.length <= 1) return; ages.pop(); D.input.expenses.forEach(function (e) { e.points.pop(); }); ui.livingSel = Math.min(ui.livingSel, ages.length - 1); },
  livingSel: function (a) { ui.livingSel = +a; render(); return 'norecalc'; },
  copyPrevAge: function () { var i = ui.livingSel; if (i < 1) return; D.input.expenses.forEach(function (e) { e.points[i].amount = e.points[i - 1].amount; }); },
  bulkInvest: function () {
    var b = ui.bulk || {};
    var f = parseInt(document.getElementById('bulk-from').value, 10), t = parseInt(document.getElementById('bulk-to').value, 10), m = Number(String(document.getElementById('bulk-amt').value).replace(/[,\s]/g, ''));
    if (isNaN(f) || isNaN(t) || isNaN(m) || t < f) { toast('年と金額を確認してください'); return 'norecalc'; }
    for (var y = f; y <= t; y++) D.input.invest.byYear[y] = m * 1e4;
    ui.bulk = { from: f, to: t, amount: m };
    toast(f + '〜' + t + '年を年' + m + '万円にしました');
  },
  investAll: function () { ui.investShowAll = true; render(); return 'norecalc'; },
  order: function (a, el) { D.input.withdraw.order = el.value === 'p' ? ['parentNisa', 'taxable'] : ['taxable', 'parentNisa']; },
  addIdeco: function () { var used = D.input.ideco.map(function (d) { return d.who; }); D.input.ideco.push({ who: used.indexOf('head') < 0 ? 'head' : 'spouse', monthly: 23000, startYear: D.input.snapshot.year, endAge: 65, receiveAge: 65, taxSavingRate: 0.2 }); },
  delIdeco: function (a) { D.input.ideco.splice(+a, 1); D.input.snapshot.ideco.splice(+a, 1); },
  addChild: function () { D.input.household.children.push({ name: '子供' + (D.input.household.children.length + 1), birthYear: nowYear() + 1 }); },
  delChild: function (a) { D.input.household.children.splice(+a, 1); D.input.snapshot.childNisa.splice(+a, 1); },
  addEvent: function () { D.input.events.push({ year: D.input.snapshot.year + 1, name: '新しいイベント', amount: 0 }); },
  delEvent: function (a) { D.input.events.splice(+a, 1); },
  evKind: function (a, el) { var e = D.input.events[+a]; e.amount = Math.abs(e.amount) * (el.value === 'in' ? -1 : 1); },
  snapThisYear: function () { D.input.snapshot.year = nowYear(); toast('起点を' + nowYear() + '年にしました。残高を入力してください'); },
  zoomChart: function () { openZoom(null); return 'norecalc'; },
  toggleCol: function (a) { ui.tableHidden[a] = !ui.tableHidden[a]; render(); return 'norecalc'; },
  copyCsv: function () { copyText(csvText(), '表をCSVとしてコピーしました'); return 'norecalc'; },
  saveScenario: function () {
    var name = (document.getElementById('sc-name').value || '').trim() || ('シナリオ ' + (D.scenarios.length + 1));
    D.scenarios.push({ name: name, input: clone(D.input), savedAt: new Date().toISOString() });
    toast('「' + name + '」を保存しました');
  },
  confirm: function (a) { ui.confirm = a; render(); return 'norecalc'; },
  cancelConfirm: function () { ui.confirm = null; render(); return 'norecalc'; },
  applyScenario: function (a) { D.input = normalize(clone(D.scenarios[+a].input)); ui.confirm = null; toast('「' + D.scenarios[+a].name + '」の条件を読み込みました'); },
  delScenario: function (a) { var n = D.scenarios[+a].name; D.scenarios.splice(+a, 1); ui.confirm = null; toast('「' + n + '」を削除しました'); },
  reset: function () { D.input = normalize(clone(DEFAULT_INPUT)); ui.confirm = null; ui.keepSample = true; toast('見本データに戻しました'); },
  copyJson: function () { copyText(JSON.stringify(D, null, 1), 'データをコピーしました'); return 'norecalc'; },
  showImport: function () { ui.importOpen = true; render(); return 'norecalc'; },
  hideImport: function () { ui.importOpen = false; render(); return 'norecalc'; },
  doImport: function () { var t = document.getElementById('json-in').value; if (applyImported(t)) { ui.importOpen = false; } else return 'norecalc'; },
  driveConnect: function () { driveConnect(); return 'norecalc'; },
  driveCreate: function () { driveCreate(); return 'norecalc'; },
  drivePick: function () { drivePick(); return 'norecalc'; },
  driveSave: function () { driveSave(false, false); return 'norecalc'; },
  driveForceSave: function () { driveSave(false, true); return 'norecalc'; },
  driveLoad: function () { driveLoad(); return 'norecalc'; },
  driveSwitch: function () { var st = D.settings; st.fileId = ''; st.fileName = ''; st.fileOwner = ''; st.fileRev = ''; st.fileRevLoaded = ''; drive.conflict = null; drive.shares = null; ui.confirm = null; persistLocal(); setDriveStatus('保存先を選び直してください。', ''); render(); return 'norecalc'; },
  driveDisconnect: function () { if (drive.token && window.google && google.accounts && google.accounts.oauth2) google.accounts.oauth2.revoke(drive.token, function () {}); drive.token = null; setDriveStatus('接続を解除しました。', ''); render(); return 'norecalc'; },
  shareAdd: function () { shareAdd(); return 'norecalc'; },
  shareRemove: function (a) { shareRemove(a); return 'norecalc'; }
};
function onClick(ev) {
  var el = ev.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'SELECT' || (el.tagName === 'INPUT' && el.type === 'checkbox')) return;
  var fn = ACTS[el.getAttribute('data-act')]; if (!fn) return;
  var r = fn(el.getAttribute('data-arg'), el);
  if (r === 'norecalc') return;
  normalize(D.input); changed(); render();
}
function onChange(ev) {
  var el = ev.target;
  if (el.hasAttribute('data-act') && (el.tagName === 'SELECT' || el.type === 'checkbox')) {
    var fn = ACTS[el.getAttribute('data-act')]; if (!fn) return;
    fn(el.getAttribute('data-arg'), el); normalize(D.input); changed(); render(); return;
  }
  onChangeStructural(ev);
}
function copyText(text, msg) {
  try {
    navigator.clipboard.writeText(text).then(function () { toast(msg); }, function () { fallbackCopy(text, msg); });
  } catch (e) { fallbackCopy(text, msg); }
}
function fallbackCopy(text, msg) {
  var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  toast(ok ? msg : 'コピーできませんでした');
}
function applyImported(text) {
  try {
    var obj = JSON.parse(text);
    var inp = obj.input || obj;
    if (!inp.household || !inp.snapshot || !inp.invest) throw new Error('形式が違います');
    D.input = normalize(inp);
    if (obj.scenarios) D.scenarios = obj.scenarios;
    toast('データを読み込みました');
    return true;
  } catch (e) { toast('読み込めませんでした:' + e.message); return false; }
}
function importFile(input) {
  var f = input.files && input.files[0]; if (!f) return;
  var rd = new FileReader();
  rd.onload = function () { if (applyImported(String(rd.result))) { normalize(D.input); changed(); render(); } };
  rd.readAsText(f);
}

// ---------- Googleドライブ(共有ファイル方式) ----------
var DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
var DRIVE_FOLDER = 'ライフプラン';
var META_FIELDS = 'id,name,headRevisionId,modifiedTime,ownedByMe,owners(displayName,emailAddress),lastModifyingUser(displayName,emailAddress,me)';
function setDriveStatus(msg, type) { drive.status = msg; drive.statusType = type || ''; var el = document.getElementById('drive-status'); if (el) { el.textContent = msg + (drive.lastSync ? ' 最終同期 ' + fmtTime(drive.lastSync) : ''); el.className = 'status' + (type ? ' ' + type : ''); } }
function loadScript(src) {
  return new Promise(function (res, rej) {
    var s = document.createElement('script'); s.src = src; s.async = true;
    s.onload = function () { res(); };
    s.onerror = function () { rej(new Error('Googleの部品を読み込めませんでした。このプレビュー画面では使えません。GitHub Pagesに置いた版で接続してください。')); };
    document.head.appendChild(s);
  });
}
function loadGis() { return window.google && google.accounts && google.accounts.oauth2 ? Promise.resolve() : loadScript('https://accounts.google.com/gsi/client'); }
function loadPicker() {
  var ready = function () { return new Promise(function (res) { gapi.load('picker', function () { res(); }); }); };
  if (window.google && google.picker) return Promise.resolve();
  if (window.gapi) return ready();
  return loadScript('https://apis.google.com/js/api.js').then(ready);
}
function getToken(prompt) {
  return loadGis().then(function () {
    return new Promise(function (res, rej) {
      var tc = google.accounts.oauth2.initTokenClient({
        client_id: D.settings.clientId,
        scope: DRIVE_SCOPE,
        callback: function (r) { if (r.error) return rej(new Error(r.error_description || r.error)); drive.token = r.access_token; drive.exp = Date.now() + (Number(r.expires_in || 3600) - 60) * 1000; res(drive.token); },
        error_callback: function (e) { rej(new Error(e && e.type === 'popup_closed' ? 'ログイン画面が閉じられました' : 'ログインできませんでした')); }
      });
      tc.requestAccessToken({ prompt: prompt });
    });
  });
}
function ensureToken() { if (drive.token && Date.now() < drive.exp) return Promise.resolve(drive.token); return getToken(''); }
function api(url, opt) {
  opt = opt || {}; opt.headers = Object.assign({ Authorization: 'Bearer ' + drive.token }, opt.headers || {});
  return fetch(url, opt).then(function (r) {
    if (r.ok) return r;
    if (r.status === 404) throw new Error('保存先のファイルが見つかりません。削除されたか、共有が解除された可能性があります。');
    if (r.status === 401 || r.status === 403) throw new Error('このファイルを扱う権限がありません(' + r.status + ')。');
    throw new Error('Googleドライブの応答エラー(' + r.status + ')');
  });
}
var DAPI = 'https://www.googleapis.com/drive/v3/files';
function rememberFile(m) {
  var st = D.settings;
  st.fileId = m.id; st.fileName = m.name;
  st.fileOwnedByMe = m.ownedByMe !== false;
  st.fileOwner = m.owners && m.owners[0] ? (m.ownedByMe ? 'あなた' : (m.owners[0].displayName || m.owners[0].emailAddress)) : '';
  if (m.headRevisionId) st.fileRev = m.headRevisionId;
  persistLocal();
}
function fetchMeta() { return api(DAPI + '/' + D.settings.fileId + '?fields=' + encodeURIComponent(META_FIELDS)).then(function (r) { return r.json(); }); }
function payload() { return JSON.stringify({ format: 'lifeplan', v: 1, input: D.input, scenarios: D.scenarios, savedAt: D.savedAt }); }
function findExisting() {
  var q = encodeURIComponent("name='" + DRIVE_FILE + "' and trashed=false");
  return api(DAPI + '?q=' + q + '&orderBy=modifiedTime desc&pageSize=5&fields=' + encodeURIComponent('files(' + META_FIELDS + ')'))
    .then(function (r) { return r.json(); }).then(function (j) { return (j.files || [])[0] || null; });
}
function driveConnect() {
  setDriveStatus('接続しています…', '');
  getToken(D.settings.fileId ? '' : 'consent').then(function () {
    if (D.settings.fileId) return fetchMeta().then(function (m) { rememberFile(m); return m; });
    return findExisting().then(function (m) { if (m) rememberFile(m); return m; });
  }).then(function (m) {
    if (m) {
      var newer = m.headRevisionId && m.headRevisionId !== D.settings.fileRevLoaded;
      setDriveStatus('接続しました。' + (newer ? '「Googleドライブから読み込む」で最新のデータを読み込めます。' : ''), 'okk');
    } else setDriveStatus('接続しました。保存先のファイルを決めてください。', 'okk');
    render();
    if (D.settings.fileId) refreshShares();
  }).catch(function (e) { setDriveStatus(e.message, 'err'); render(); });
}
function findOrCreateFolder() {
  var q = encodeURIComponent("name='" + DRIVE_FOLDER + "' and mimeType='application/vnd.google-apps.folder' and trashed=false");
  return api(DAPI + '?q=' + q + '&fields=files(id)').then(function (r) { return r.json(); }).then(function (j) {
    if (j.files && j.files[0]) return j.files[0].id;
    return api(DAPI + '?fields=id', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: DRIVE_FOLDER, mimeType: 'application/vnd.google-apps.folder' }) })
      .then(function (r) { return r.json(); }).then(function (f) { return f.id; });
  });
}
function driveCreate() {
  setDriveStatus('ファイルを作っています…', '');
  ensureToken().then(findOrCreateFolder).then(function (folderId) {
    var boundary = 'lp' + Date.now();
    var meta = { name: DRIVE_FILE, parents: [folderId], mimeType: 'application/json' };
    var multi = '--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(meta) + '\r\n--' + boundary + '\r\nContent-Type: application/json\r\n\r\n' + payload() + '\r\n--' + boundary + '--';
    return api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=' + encodeURIComponent(META_FIELDS), { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + boundary }, body: multi });
  }).then(function (r) { return r.json(); }).then(function (m) {
    rememberFile(m); D.settings.fileRevLoaded = m.headRevisionId; persistLocal();
    drive.lastSync = new Date().toISOString(); drive.shares = [];
    setDriveStatus('「' + DRIVE_FOLDER + '」フォルダに保存しました。', 'okk'); toast('Googleドライブに保存しました'); render();
  }).catch(function (e) { setDriveStatus(e.message, 'err'); });
}
function drivePick() {
  var st = D.settings;
  if (!st.apiKey || !st.appId) { setDriveStatus('ファイルを選ぶには、接続の設定でAPIキーとプロジェクト番号を入力してください。', 'err'); return; }
  ensureToken().then(loadPicker).then(function () {
    var shared = new google.picker.DocsView(google.picker.ViewId.DOCS).setMimeTypes('application/json').setOwnedByMe(false).setQuery(DRIVE_FILE);
    var mine = new google.picker.DocsView(google.picker.ViewId.DOCS).setMimeTypes('application/json').setOwnedByMe(true).setQuery(DRIVE_FILE);
    var picker = new google.picker.PickerBuilder()
      .setTitle('ライフプランのファイルを選ぶ')
      .setLocale('ja')
      .addView(shared).addView(mine)
      .setOAuthToken(drive.token).setDeveloperKey(st.apiKey).setAppId(st.appId)
      .setCallback(function (d) {
        if (d.action !== google.picker.Action.PICKED || !d.docs || !d.docs[0]) return;
        st.fileId = d.docs[0].id;
        fetchMeta().then(function (m) { rememberFile(m); setDriveStatus('「' + m.name + '」を保存先にしました。続けて読み込みます…', 'okk'); return driveLoad(); })
          .catch(function (e) { setDriveStatus(e.message, 'err'); render(); });
      }).build();
    picker.setVisible(true);
  }).catch(function (e) { setDriveStatus(e.message, 'err'); });
}
var saving = false;
function driveSave(silent, force) {
  if (saving || !D.settings.fileId) return;
  if (drive.conflict && !force) { setDriveStatus('ほかの人の新しいデータがあるため、自動保存を止めています。', 'err'); return; }
  saving = true;
  ensureToken().then(fetchMeta).then(function (m) {
    var known = D.settings.fileRevLoaded;
    if (!force && known && m.headRevisionId && m.headRevisionId !== known) {
      drive.conflict = m; setDriveStatus('ほかの端末か家族が先に保存しています。どちらを残すか選んでください。', 'err');
      if (ui.view === 'sync') render(); else toast('Googleドライブに新しいデータがあります(同期とデータを確認)');
      return null;
    }
    return api('https://www.googleapis.com/upload/drive/v3/files/' + D.settings.fileId + '?uploadType=media&fields=' + encodeURIComponent(META_FIELDS), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: payload() })
      .then(function (r) { return r.json(); }).then(function (m2) {
        rememberFile(m2); D.settings.fileRevLoaded = m2.headRevisionId; persistLocal();
        drive.conflict = null; ui.confirm = null;
        drive.lastSync = new Date().toISOString(); setDriveStatus('Googleドライブに保存しました。', 'okk');
        if (!silent) toast('Googleドライブに保存しました');
        if (force && ui.view === 'sync') render();
      });
  }).catch(function (e) { setDriveStatus(e.message, 'err'); if (!silent) toast('保存できませんでした'); })
    .then(function () { saving = false; });
}
function driveLoad() {
  return ensureToken().then(fetchMeta).then(function (m) {
    return api(DAPI + '/' + m.id + '?alt=media').then(function (r) { return r.json(); }).then(function (obj) {
      if (!obj || !obj.input) throw new Error('ファイルの中身を読み取れませんでした');
      D.input = normalize(obj.input); D.scenarios = obj.scenarios || D.scenarios || []; D.savedAt = obj.savedAt || m.modifiedTime;
      rememberFile(m); D.settings.fileRevLoaded = m.headRevisionId;
      drive.conflict = null; ui.confirm = null;
      recompute(); persistLocal();
      baseline = { at65: R.summary.at65 ? R.summary.at65.total : null };
      drive.lastSync = new Date().toISOString();
      setDriveStatus('Googleドライブから読み込みました(' + fmtTime(m.modifiedTime) + ' ' + personLabel(m.lastModifyingUser) + 'が保存)。', 'okk');
      toast('最新のデータを読み込みました');
      render();
    });
  }).catch(function (e) { setDriveStatus(e.message, 'err'); toast('読み込めませんでした'); render(); });
}
function refreshShares() {
  if (!D.settings.fileId || D.settings.fileOwnedByMe === false) return;
  drive.shares = null;
  ensureToken().then(function () { return api(DAPI + '/' + D.settings.fileId + '/permissions?fields=' + encodeURIComponent('permissions(id,type,role,emailAddress,displayName)')); })
    .then(function (r) { return r.json(); }).then(function (j) { drive.shares = j.permissions || []; var el = document.getElementById('share-list'); if (el) el.innerHTML = shareListHtml(); })
    .catch(function (e) { drive.shares = []; var el = document.getElementById('share-list'); if (el) el.innerHTML = '<p class="status err">' + esc(e.message) + '</p>'; });
}
function shareAdd() {
  var email = (document.getElementById('share-email').value || '').trim();
  var role = document.getElementById('share-role').value;
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { toast('メールアドレスを確認してください'); return; }
  ensureToken().then(function () {
    return api(DAPI + '/' + D.settings.fileId + '/permissions?sendNotificationEmail=true&emailMessage=' + encodeURIComponent('ライフプランシミュレーターのデータを共有しました。'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'user', role: role, emailAddress: email }) });
  }).then(function () { toast(email + ' と共有しました'); render(); refreshShares(); })
    .catch(function (e) { toast('共有できませんでした:' + e.message); });
}
function shareRemove(pid) {
  ensureToken().then(function () { return api(DAPI + '/' + D.settings.fileId + '/permissions/' + encodeURIComponent(pid), { method: 'DELETE' }); })
    .then(function () { ui.confirm = null; toast('共有を解除しました'); render(); refreshShares(); })
    .catch(function (e) { toast('解除できませんでした:' + e.message); });
}

// ---------- 起動 ----------
D = load() || fresh();
D.settings = Object.assign({ clientId: '', apiKey: '', appId: '', driveAuto: true }, D.settings || {});
D.scenarios = D.scenarios || [];
D.input = normalize(D.input || clone(DEFAULT_INPUT));
recompute();
baseline = { at65: R.summary.at65 ? R.summary.at65.total : null };
var view = document.getElementById('view');
view.addEventListener('input', onInput);
view.addEventListener('change', onChange);
view.addEventListener('click', onClick);
window.addEventListener('hashchange', route);
// スマートディスプレイ側から表示を呼び出すための窓口
window.LifePlanApp = { showDisplay: function () { displayOverride = null; location.hash = 'display'; }, display: displayFromData, close: closeDisplay };
route();
})();
</script>
